<svg xmlns='http://www.w3.org/2000/svg' width='980' height='440' viewBox='0 0 980 440'><rect width='980' height='440' fill='#fff'/><text x='490' y='30' text-anchor='middle' font-size='16' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">算法选择的收益上限：VBS−SBS 差距审计</text><text x='490' y='47' text-anchor='middle' font-size='11' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">选择器能收割的最大期望收益 = 虚拟最优（逐实例选最佳）与固定最优单算法之间的差距——差距靠互补性造出来</text><text x='265' y='69' text-anchor='middle' font-size='12' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">a   有互补性的库：选择器有收益空间</text><line x1='70' y1='360' x2='70' y2='95' stroke='#444444' stroke-width='1'/><line x1='70' y1='360' x2='460' y2='360' stroke='#444444' stroke-width='1'/><text x='60' y='228' text-anchor='end' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">平均成本（越低越好）</text><rect x='135' y='153' width='330' height='127' fill='#009E73' opacity='0.13'/><rect x='135' y='280' width='110' height='80' fill='#009E73'/><rect x='325' y='153' width='110' height='207' fill='#0072B2'/><text x='190' y='272' text-anchor='middle' font-size='10.5' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">逐实例选最优</text><text x='380' y='145' text-anchor='middle' font-size='10.5' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">如 PyVRP 默认</text><text x='190' y='378' text-anchor='middle' font-size='10' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">VBS（虚拟最优）</text><text x='380' y='378' text-anchor='middle' font-size='10' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">SBS（固定最优）</text><line x1='271' y1='153' x2='271' y2='280' stroke='#009E73' stroke-width='2'/><line x1='267' y1='153' x2='275' y2='153' stroke='#009E73' stroke-width='2'/><line x1='267' y1='280' x2='275' y2='280' stroke='#009E73' stroke-width='2'/><text x='281' y='213' text-anchor='start' font-size='10' fill='#009E73' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">VBS−SBS 差距</text><text x='281' y='229' text-anchor='start' font-size='10' fill='#009E73' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">= 收益上限</text><text x='265' y='400' text-anchor='middle' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">示意：无具体刻度</text><text x='720' y='69' text-anchor='middle' font-size='12' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">b   URP 欧氏 CVRP 现状：VBS ≈ SBS</text><line x1='525' y1='360' x2='525' y2='95' stroke='#444444' stroke-width='1'/><line x1='525' y1='360' x2='915' y2='360' stroke='#444444' stroke-width='1'/><rect x='590' y='153' width='330' height='9' fill='#D55E00' opacity='0.13'/><rect x='590' y='163' width='110' height='197' fill='#009E73'/><rect x='780' y='153' width='110' height='207' fill='#0072B2'/><text x='645' y='155' text-anchor='middle' font-size='10.5' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">VBS ≈ SBS</text><text x='835' y='145' text-anchor='middle' font-size='10.5' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">PyVRP（265/265 可行）</text><text x='645' y='378' text-anchor='middle' font-size='10' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">VBS（虚拟最优）</text><text x='835' y='378' text-anchor='middle' font-size='10' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">SBS（固定最优）</text><line x1='726' y1='153' x2='726' y2='163' stroke='#D55E00' stroke-width='2'/><line x1='722' y1='153' x2='730' y2='153' stroke='#D55E00' stroke-width='2'/><line x1='722' y1='163' x2='730' y2='163' stroke='#D55E00' stroke-width='2'/><line x1='729' y1='158' x2='907' y2='207' stroke='#D55E00' stroke-width='1'/><text x='905' y='195' text-anchor='end' font-size='10' fill='#D55E00' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">≈0.341pp →</text><text x='905' y='211' text-anchor='end' font-size='10' fill='#D55E00' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">替代选择 0 次</text><text x='720' y='400' text-anchor='middle' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">URP 实测：问题等权平均参考差距 0.341%</text><text x='16' y='424' text-anchor='start' font-size='9' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">概念框架：ASlib（Bischl et al. 2016）；URP 实测值见仓库 README 与 docs/导师查看.md</text><text x='540' y='200' text-anchor='start' font-size='9' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">（纵轴同左）</text></svg>