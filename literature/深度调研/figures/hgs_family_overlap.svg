<svg xmlns='http://www.w3.org/2000/svg' width='980' height='510' viewBox='0 0 980 510'><rect width='980' height='510' fill='#fff'/><text x='490' y='30' text-anchor='middle' font-size='16' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">同族画像重叠 → 选择零收益；跨规模排名切换 → 互补性的结构轴</text><text x='490' y='47' text-anchor='middle' font-size='11' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">左：URP 库内 HGS 同族在 X 实例集画像一致（VBS≈SBS）；右：2026 快照显示最优方法随实例规模切换</text><text x='258' y='69' text-anchor='middle' font-size='12' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">a   HGS 系画像重叠（X 集，PyVRP 论文协议）</text><line x1='66' y1='396' x2='452' y2='396' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='400' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0</text><line x1='66' y1='340' x2='452' y2='340' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='344' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.05</text><line x1='66' y1='285' x2='452' y2='285' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='289' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.1</text><line x1='66' y1='230' x2='452' y2='230' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='233' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.15</text><line x1='66' y1='174' x2='452' y2='174' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='178' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.2</text><line x1='66' y1='119' x2='452' y2='119' stroke='#E6E6E6' stroke-width='1'/><text x='58' y='122' text-anchor='end' font-size='10' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.25</text><text x='14' y='244' text-anchor='middle' font-size='10.5' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">平均差距（%）</text><line x1='66' y1='396' x2='66' y2='91' stroke='#444444' stroke-width='1'/><line x1='66' y1='396' x2='452' y2='396' stroke='#444444' stroke-width='1'/><rect x='98' y='152' width='64' height='244' fill='#0072B2'/><text x='130' y='145' text-anchor='middle' font-size='11' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.22%</text><text x='130' y='413' text-anchor='middle' font-size='10.5' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">PyVRP</text><text x='130' y='427' text-anchor='middle' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">URP 库主力</text><rect x='227' y='163' width='64' height='233' fill='#56B4E9'/><text x='259' y='156' text-anchor='middle' font-size='11' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.21%</text><text x='259' y='413' text-anchor='middle' font-size='10.5' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">HGS-2012</text><text x='259' y='427' text-anchor='middle' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">同族</text><rect x='356' y='274' width='64' height='122' fill='#56B4E9'/><text x='388' y='267' text-anchor='middle' font-size='11' fill='#1a1a1a' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">0.11%</text><text x='388' y='413' text-anchor='middle' font-size='10.5' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">HGS-CVRP</text><text x='388' y='427' text-anchor='middle' font-size='9.5' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">同族（VRPTW 0