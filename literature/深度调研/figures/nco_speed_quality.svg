,Helvetica,Arial,sans-serif">LKH：≈0% @ 12 小时</text><line x1='535' y1='273' x2='269' y2='204' stroke='#D55E00' stroke-width='2'/><polygon points='269,204 275,203 274,208' fill='#D55E00' opacity='1'/><text x='323' y='302' text-anchor='middle' font-size='10' fill='#D55E00' font-weight='700' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">×360 速度，仅 +0.32pp 差距</text><text x='323' y='322' text-anchor='middle' font-size='9.5' fill='#555555' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">——暖启动 PyVRP 的接口位</text><text x='16' y='490' text-anchor='start' font-size='9' fill='#888888' font-family="Noto Sans CJK SC,Noto Sans,Helvetica,Arial,sans-serif">来源：数值引自本报告 §5.2 对 NCO 批判文献的综合（POMO，Kwon et al. 2020；LKH-3，Helsgaun 2017）</text></svg>