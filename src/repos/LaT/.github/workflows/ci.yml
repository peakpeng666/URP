name: Unified project integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without large LFS objects
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Compile the unified codebase
        run: >-
          python -m compileall -q
          lat.py train.py test.py generate_data.py
          Trainer.py Tester.py utils.py models envs trainers testers

      - name: Check the unified model registry
        run: python lat.py list
