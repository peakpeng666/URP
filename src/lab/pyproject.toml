[project]
name = "urp-lab"
version = "0.1.0"
description = "URP 科研面板：网关、求解适配、路径检查、推荐与仿真编排（不改写 src/research 冻结模块）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn[standard]==0.54.0",
  "httpx>=0.28",
  "pyvrp==0.14.0",
  "ortools==9.15.6755",
  "shapely==2.2.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
