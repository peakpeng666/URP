name: URP engineering checks

on:
  pull_request:
  push:
    branches: [main, cvrp-baselines, redo, deploy, 'optimize/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agriculture-contracts:
    # Real TS builders -> Python validator. No ROS, physical execution or external model APIs.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            src/lab
            src/frontend
            src/research
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
      - run: uv sync --locked --inexact
        working-directory: src/lab
      - run: npm ci --prefix src/frontend --engine-strict --no-audit --no-fund
      - name: Validate all agriculture builders against the real backend contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p .local-state/agriculture-contracts
          node src/frontend/tools/check-agri-contract.mjs .local-state/agriculture-contracts/builders.json
      - name: Check scenario provenance preservation and legacy import compatibility
        working-directory: src/lab
        run: uv run --no-sync python -m pytest -q tests/test_agri_import_provenance.py tests/test_optional_map_scenarios.py tests/test_coverage_baseline_obstacles.py tests/test_fleet_graph_clearance.py --junitxml=../../.local-state/agriculture-contracts/import-provenance.xml
      - name: Retain agriculture contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agriculture-contracts
          path: .local-state/agriculture-contracts
          include-hidden-files: true
          if-no-files-found: warn

  nonideal-model-contracts:
    # Pure model/geometry/causal-replay checks. This job is not a Gazebo run.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            src/lab
            src/research
            src/frontend/core/routing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify Node runtime before model collection
        run: node --version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
      - run: uv sync --locked --inexact
        working-directory: src/lab
      - name: Check physical model contracts and observation-to-control replay
        working-directory: src/lab
        run: uv run --no-sync python -m pytest -q tests/test_field_physics.py tests/test_field_nonideal.py tests/test_nonideal_audit.py tests/test_ground_risk.py tests/test_ground_audit.py tests/test_field_actuation.py tests/test_result_index.py tests/test_execution_identity.py tests/test_native_execution_identity.py tests/test_invalidated_metrics.py tests/test_map_path_config.py tests/test_extended.py::test_learned_split_isolation tests/test_extended.py::test_learned_model_integrity_and_scope tests/test_extended.py::test_pre_http_simulator_failure_is_visible --junitxml=../../.local-state/nonideal-model-contracts.xml
      - name: Retain model test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nonideal-model-contracts
          path: .local-state/nonideal-model-contracts.xml
          include-hidden-files: true
          if-no-files-found: warn
  evolve-research-contracts:
    # Offline synthetic/geometry contracts only, not research or physical acceptance.
    # The serving adapter integration is explicitly deferred in src/lab/urp_lab/evolve/INTEGRATION.md.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            src/lab
            src/research
            src/frontend/core/routing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
      - run: uv sync --locked --inexact
        working-directory: src/lab
      - name: Discover evolve offline contracts (serving integration deferred)
        working-directory: src/lab
        run: >-
          uv run --no-sync python -m pytest -q tests
          -o python_files='test_evolve_*.py'
          -rs
          --junitxml=../../.local-state/evolve-research-contracts.xml
      - name: Retain evolve results and explicit skip reasons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evolve-research-contracts
          path: .local-state/evolve-research-contracts.xml
          include-hidden-files: true
          if-no-files-found: warn

  engineering:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools
            scripts
            protocol
            independent
            src/backend
            src/frontend
            src/research
            src/robotics
            data/bpp
            data/packages
            data/benchmarks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra solvers
      - run: npm ci --prefix src/frontend --engine-strict --no-audit --no-fund
      - run: uv run --no-sync python tools/check_project.py --output .local-state/ci
      - name: Retain checks and all failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engineering-checks
          path: .local-state/ci
          include-hidden-files: true
          if-no-files-found: warn


  deployment-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy
            setup/ubuntu
            cohort_b/ails
            cohort_b/sisr
            src/research
      - name: Verify preinstalled native build and archive-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-state/deployment-prerequisites
          {
            printf 'Runner image: %s / %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            # ubuntu-22.04 provides a complete JDK 17 separately from its default Java.
            # Fail closed on image drift instead of downloading another JDK during smoke tests.
            if [[ -z "${JAVA_HOME_17_X64:-}" || ! -x "$JAVA_HOME_17_X64/bin/java" || ! -x "$JAVA_HOME_17_X64/bin/javac" ]]; then
              echo '::error::The runner must provide a complete JDK 17 at JAVA_HOME_17_X64.'
              exit 1
            fi
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
            for tool in java javac g++ zstd; do
              command -v "$tool" || { echo "::error::Missing required tool: $tool"; exit 1; }
            done
            if ! java_version="$(java -version 2>&1)"; then
              printf '%s\n' "$java_version"; exit 1
            fi
            printf '%s\n' "$java_version"
            if ! javac_version="$(javac -version 2>&1)"; then
              printf '%s\n' "$javac_version"; exit 1
            fi
            printf '%s\n' "$javac_version"
            java_17_pattern='version[[:space:]]+"17([."]|$)'
            javac_17_pattern='^javac[[:space:]]+17([.]|$)'
            if [[ ! "$java_version" =~ $java_17_pattern || ! "$javac_version" =~ $javac_17_pattern ]]; then
              echo '::error::Both java and javac must report major version 17.'
              exit 1
            fi
            g++ --version
            zstd --version
            printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
            printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee .local-state/deployment-prerequisites/toolchain.txt
      - name: Check installer and publication contracts
        run: |
          for file in install.sh deploy/*.sh setup/ubuntu/*.sh; do bash -n "$file"; done
          python3 -m unittest -v test_install_entrypoints
          python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Validate a non-default published Compose port
        run: |
          for file in deploy/docker-compose.yml deploy/docker-compose.sim.yml; do
            URP_PORT=4200 docker compose -f "$file" config --format json | python3 -c 'import json,sys; lab=json.load(sys.stdin)["services"]["lab"]; assert str(lab["environment"]["URP_PORT"]) == "4100"; assert any(str(p["published"]) == "4200" and p["target"] == 4100 for p in lab["ports"])'
          done
      - name: Build and minimally execute native CVRP adapters
        run: |
          source setup/ubuntu/env.sh
          command -v java
          java -version
          LC_ALL=C LANG=C bash deploy/build-cohort.sh
          python3 deploy/check-cohort.py --output "$GITHUB_WORKSPACE/.local-state/cohort-smoke"
      - name: Retain native adapter smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-cohort-smoke
          path: .local-state/cohort-smoke
          include-hidden-files: true
          if-no-files-found: warn

      - name: Retain prerequisite toolchain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-prerequisites
          path: .local-state/deployment-prerequisites
          include-hidden-files: true
          if-no-files-found: warn

  powershell-contracts:
    # Parser and mocked launcher contracts on Windows, not a clean WSL installation.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/windows
      - name: Parse PowerShell installers without invoking WSL
        shell: pwsh
        run: |
          $files = @('install.ps1') + @(Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - name: Parse installers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('install.ps1') + @(Get-ChildItem deploy/windows -Filter *.ps1 -Recurse | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - name: Exercise PowerShell launcher and quoting contracts
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          LANG: C.UTF-8
        run: |
          # Use the runner's Git Bash for literal roundtrips, never the WSL launcher.
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe -ErrorAction Stop).Source)
          $gitBash = Join-Path $gitRoot 'bin/bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash)) { throw "Git Bash is required for quoting tests: $gitBash" }
          $env:PATH = "$(Split-Path $gitBash);$env:PATH"
          # Bare process names may search System32 before PATH on Windows.
          # The Python fixture must launch this exact verified executable.
          $env:URP_TEST_BASH = (Resolve-Path -LiteralPath $gitBash).ProviderPath
          Write-Host "Quoted-value tests use $env:URP_TEST_BASH"
          & $env:URP_TEST_BASH --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command pwsh -ErrorAction Stop | Out-Null
          python -m unittest -v test_install_entrypoints.PowerShellStaticContractTests test_install_entrypoints.WindowsLauncherTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
