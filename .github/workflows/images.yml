name: Publish images

on:
  push:
    branches: [deploy]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SOURCE: https://github.com/peakpeng666/URP

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push urp-bench
        run: bash deploy/publish-image.sh bench deploy/Dockerfile

  sim:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push urp-sim
        run: bash deploy/publish-image.sh sim deploy/Dockerfile.simulation

  visibility:
    needs: [bench, sim]
    if: always() && (needs.bench.result == 'success' || needs.sim.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Ask GitHub to mark the packages public
        run: |
          set +e
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for name in urp-bench urp-sim; do
            code="$(curl -sS -o /tmp/vis.json -w '%{http_code}' -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${name}" \
              -d '{"visibility":"public"}')"
            echo "${name} PATCH /user/packages HTTP ${code}"
            cat /tmp/vis.json || true
            echo
            code="$(curl -sS -o /tmp/vis.json -w '%{http_code}' -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${owner}/packages/container/${name}" \
              -d '{"visibility":"public"}')"
            echo "${name} PATCH /users/${owner}/packages HTTP ${code}"
            cat /tmp/vis.json || true
            echo
          done
          echo "若上面不是 200：GITHUB_TOKEN 通常不能把包改成 Public。"
          echo "主人打开一次： https://github.com/users/${owner}/packages/container/urp-sim/settings"
          echo "Package settings → Change package visibility → Public"
          echo "再对 urp-bench 做同样的操作。"
          echo "若未关联仓库：Connect repository → ${{ github.repository }}。"
          echo "工作流写入的标签是 org.opencontainers.image.source=${SOURCE}"
          exit 0
