name: Publish images

on:
  push:
    branches: [deploy]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SOURCE: https://github.com/peakpeng666/URP

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bench:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push urp-bench
        run: bash deploy/publish-image.sh bench deploy/Dockerfile
      - name: Retain bench image acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-bench-${{ github.sha }}
          path: .local-state/image-bench
          include-hidden-files: true
          if-no-files-found: warn

  sim:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push urp-sim
        run: bash deploy/publish-image.sh sim deploy/Dockerfile.simulation
      - name: Retain sim image acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-sim-${{ github.sha }}
          path: .local-state/image-sim
          include-hidden-files: true
          if-no-files-found: warn

  verify-public-pull:
    needs: [bench, sim]
    if: always() && (needs.bench.result == 'success' || needs.sim.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify anonymous pulls without changing package permissions
        env:
          BENCH_RESULT: ${{ needs.bench.result }}
          SIM_RESULT: ${{ needs.sim.result }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          for name in bench sim; do
            result="$BENCH_RESULT"
            if [[ "$name" == sim ]]; then result="$SIM_RESULT"; fi
            [[ "$result" == success ]] || continue
            image="ghcr.io/${owner}/urp-${name}:${GITHUB_SHA}"
            if ! docker pull "$image"; then
              echo "::error::Anonymous pull failed for $image. Check registry availability and package visibility manually; this workflow does not change permissions."
              exit 1
            fi
            actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            [[ "$actual" == "$GITHUB_SHA" ]] || { echo "::error::Published revision mismatch: $actual"; exit 1; }
            docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
