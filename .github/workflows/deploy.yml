name: Deploy bench

on:
  pull_request:
    paths:
      - deploy/**
      - compose.yaml
      - .dockerignore
      - src/lab/pyproject.toml
      - src/lab/uv.lock
      - src/lab/urp_lab/gateway.py
      - src/lab/urp_lab/__main__.py
      - src/lab/urp_lab/runtime_config.py
      - src/lab/urp_lab/jobs.py
      - src/lab/tests/test_deploy_access.py
      - src/lab/tests/test_node_runtime_identity.py
      - src/lab/tests/test_execution_identity.py
      - src/lab/tests/test_native_execution_identity.py
      - src/frontend/package.json
      - src/frontend/package-lock.json
      - setup/wsl/**
      - setup/run.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the selected Node runtime before test collection
        run: timeout --signal=KILL 10s node --version
      - run: uv python install 3.12.13
      - run: uv sync --locked --inexact --python 3.12.13
        working-directory: src/lab
      - run: uv run --no-sync python -m pytest -q tests/test_deploy_access.py tests/test_node_runtime_identity.py tests/test_execution_identity.py tests/test_native_execution_identity.py
        working-directory: src/lab
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -f deploy/Dockerfile -t urp-lab:ci .
      - run: docker run -d --name urp-lab -p 127.0.0.1:4100:4100 urp-lab:ci
      - name: Bench responds and remote shutdown does not
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/lab/api/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4100/lab/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4100/ | grep -qx 200
          code=$(curl -sS -o /tmp/shutdown.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:4100/lab/api/shutdown)
          test "$code" = 403
          grep -q shutdown_forbidden /tmp/shutdown.json
      - name: Agriculture works in the bench image without ROS maps
        run: |
          python3 deploy/check-agriculture.py --base-url http://127.0.0.1:4100
          python3 deploy/check-agriculture.py --base-url http://127.0.0.1:4100 --obstacle
