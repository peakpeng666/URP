syntax = "proto3";
package ignition.msgs;
message Actor {
  message Animation {
    string name = 1;
    string filename = 2;
    float scale = 3;
    bool interpolate_x = 4;
  }
  message Waypoint {
    float time = 1;
    .ignition.msgs.Pose pose = 2;
  }
  message Trajectory {
    uint32 id = 1;
    string type = 2;
    float tension = 3;
    repeated .ignition.msgs.Actor.Waypoint waypoints = 4;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Entity entity = 2;
  .ignition.msgs.Pose pose = 3;
  string skin_filename = 4;
  float skin_scale = 5;
  repeated .ignition.msgs.Actor.Animation animations = 6;
  bool script_loop = 7;
  float script_delay_start = 8;
  bool script_auto_start = 9;
  repeated .ignition.msgs.Actor.Trajectory trajectories = 10;
  .ignition.msgs.Entity parent = 11;
}
message Actuators {
  .ignition.msgs.Header header = 1;
  repeated double position = 2;
  repeated double velocity = 3;
  repeated double normalized = 4;
}
message AirPressureSensor {
  .ignition.msgs.Header header = 1;
  double reference_altitude = 2;
  .ignition.msgs.SensorNoise pressure_noise = 3;
}
message Altimeter {
  .ignition.msgs.Header header = 1;
  double vertical_position = 2;
  double vertical_velocity = 3;
  double vertical_reference = 4;
}
message AltimeterSensor {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.SensorNoise vertical_position_noise = 2;
  .ignition.msgs.SensorNoise vertical_velocity_noise = 3;
}
message AnnotatedAxisAligned2DBox {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.AxisAligned2DBox box = 2;
  uint32 label = 3;
}
message AnnotatedAxisAligned2DBox_V {
  .ignition.msgs.Header header = 1;
  repeated .ignition.msgs.AnnotatedAxisAligned2DBox annotated_box = 2;
}
message AnnotatedOriented3DBox {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Oriented3DBox box = 2;
  uint32 label = 3;
}
message AnnotatedOriented3DBox_V {
  .ignition.msgs.Header header = 1;
  repeated .ignition.msgs.AnnotatedOriented3DBox annotated_box = 2;
}
message Any {
  enum ValueType {
    NONE = 0;
    DOUBLE = 1;
    INT32 = 2;
    STRING = 3;
    BOOLEAN = 4;
    VECTOR3D = 5;
    COLOR = 6;
    POSE3D = 7;
    QUATERNIOND = 8;
    TIME = 9;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Any.ValueType type = 2;
  oneof value {
    double double_value = 3;
    int32 int_value = 4;
    string string_value = 5;
    bool bool_value = 6;
    .ignition.msgs.Vector3d vector3d_value = 7;
    .ignition.msgs.Color color_value = 8;
    .ignition.msgs.Pose pose3d_value = 9;
    .ignition.msgs.Quaternion quaternion_value = 10;
    .ignition.msgs.Time time_value = 11;
  }
}
message Atmosphere {
  enum Type {
    ADIABATIC = 0;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Atmosphere.Type type = 2;
  double temperature = 3;
  double pressure = 4;
  double mass_density = 5;
  bool enable_atmosphere = 6;
}
message Axis {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector3d xyz = 2;
  double limit_lower = 3;
  double limit_upper = 4;
  double limit_effort = 5;
  double limit_velocity = 6;
  double damping = 7;
  double friction = 8;
  double position = 10;
  double velocity = 11;
  double force = 12;
  double acceleration = 13;
  string xyz_expressed_in = 14;
}
message AxisAligned2DBox {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector2d min_corner = 2;
  .ignition.msgs.Vector2d max_corner = 3;
}
message AxisAlignedBox {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector3d min_corner = 2;
  .ignition.msgs.Vector3d max_corner = 3;
}
message Battery {
  .ignition.msgs.Header header = 1;
  string name = 2;
  double voltage = 3;
}
message BatteryState {
  enum PowerSupplyStatus {
    UNKNOWN = 0;
    CHARGING = 1;
    DISCHARGING = 2;
    NOT_CHARGING = 3;
    FULL = 4;
  }
  .ignition.msgs.Header header = 1;
  double voltage = 2;
  double current = 3;
  double charge = 4;
  double capacity = 5;
  double percentage = 6;
  .ignition.msgs.BatteryState.PowerSupplyStatus power_supply_status = 7;
}
message Boolean {
  .ignition.msgs.Header header = 1;
  bool data = 2;
}
message BoxGeom {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector3d size = 2;
}
message Bytes {
  .ignition.msgs.Header header = 1;
  bytes data = 2;
}
message CameraCmd {
  .ignition.msgs.Header header = 1;
  string follow_model = 2;
}
message CameraInfo {
  message Distortion {
    enum DistortionModelType {
      PLUMB_BOB = 0;
      RATIONAL_POLYNOMIAL = 1;
      EQUIDISTANT = 2;
    }
    .ignition.msgs.CameraInfo.Distortion.DistortionModelType model = 1;
    repeated double k = 2;
  }
  message Intrinsics {
    repeated double k = 1;
  }
  message Projection {
    repeated double p = 1;
  }
  .ignition.msgs.Header header = 1;
  uint32 width = 2;
  uint32 height = 3;
  .ignition.msgs.CameraInfo.Distortion distortion = 4;
  .ignition.msgs.CameraInfo.Intrinsics intrinsics = 5;
  .ignition.msgs.CameraInfo.Projection projection = 6;
  repeated double rectification_matrix = 7 [packed = true];
}
message CameraLens {
  .ignition.msgs.Header header = 1;
  string type = 2;
  double c1 = 3;
  double c2 = 4;
  double c3 = 5;
  double f = 6;
  string fun = 7;
  bool scale_to_hfov = 8;
  double cutoff_angle = 9;
  double hfov = 10;
  int32 env_texture_size = 11;
}
message CameraSensor {
  .ignition.msgs.Header header = 1;
  double horizontal_fov = 2;
  .ignition.msgs.Vector2d image_size = 3;
  string image_format = 4;
  double near_clip = 5;
  double far_clip = 6;
  bool save_enabled = 7;
  string save_path = 8;
  .ignition.msgs.Distortion distortion = 9;
}
message CapsuleGeom {
  .ignition.msgs.Header header = 1;
  double radius = 2;
  double length = 3;
}
message Cessna {
  .ignition.msgs.Header header = 1;
  float propeller_speed = 2;
  float left_aileron = 3;
  float left_flap = 4;
  float right_aileron = 5;
  float right_flap = 6;
  float elevators = 7;
  float rudder = 8;
  float cmd_propeller_speed = 9;
  float cmd_left_aileron = 10;
  float cmd_left_flap = 11;
  float cmd_right_aileron = 12;
  float cmd_right_flap = 13;
  float cmd_elevators = 14;
  float cmd_rudder = 15;
}
message Clock {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Time system = 2;
  .ignition.msgs.Time real = 3;
  .ignition.msgs.Time sim = 4;
}
message CmdVel2D {
  .ignition.msgs.Header header = 1;
  double velocity = 2;
  double theta = 3;
}
message Collision {
  .ignition.msgs.Header header = 1;
  uint32 id = 2;
  string name = 3;
  double laser_retro = 4;
  double max_contacts = 5;
  .ignition.msgs.Pose pose = 6;
  .ignition.msgs.Geometry geometry = 7;
  .ignition.msgs.Surface surface = 8;
  repeated .ignition.msgs.Visual visual = 9;
}
message Color {
  .ignition.msgs.Header header = 1;
  float r = 2;
  float g = 3;
  float b = 4;
  float a = 5;
}
message ConeGeom {
  .ignition.msgs.Header header = 1;
  double radius = 2;
  double length = 3;
}
message Contact {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Entity collision1 = 2;
  .ignition.msgs.Entity collision2 = 3;
  repeated .ignition.msgs.Vector3d position = 4;
  repeated .ignition.msgs.Vector3d normal = 5;
  repeated double depth = 6;
  repeated .ignition.msgs.JointWrench wrench = 7;
  .ignition.msgs.Entity world = 8;
}
message ContactSensor {
  .ignition.msgs.Header header = 1;
  string collision_name = 2;
}
message Contacts {
  .ignition.msgs.Header header = 1;
  repeated .ignition.msgs.Contact contact = 2;
}
message CylinderGeom {
  .ignition.msgs.Header header = 1;
  double radius = 2;
  double length = 3;
}
message Dataframe {
  .ignition.msgs.Header header = 1;
  string src_address = 2;
  string dst_address = 3;
  bytes data = 4;
}
message Density {
  .ignition.msgs.Header header = 1;
  double density = 2;
}
message Diagnostics {
  message DiagTime {
    string name = 1;
    .ignition.msgs.Time elapsed = 2;
    .ignition.msgs.Time wall = 3;
  }
  .ignition.msgs.Header header = 1;
  repeated .ignition.msgs.Diagnostics.DiagTime time = 2;
  .ignition.msgs.Time real_time = 3;
  .ignition.msgs.Time sim_time = 4;
  double real_time_factor = 5;
}
message Discovery {
  message Flags {
    bool relay = 1;
    bool no_relay = 2;
  }
  message Subscriber {
    string topic = 1;
  }
  message Publisher {
    message MessagePublisher {
      string ctrl = 1;
      string msg_type = 2;
      bool throttled = 3;
      uint64 msgs_per_sec = 4;
    }
    message ServicePublisher {
      string socket_id = 1;
      string request_type = 2;
      string response_type = 3;
    }
    enum Scope {
      PROCESS = 0;
      HOST = 1;
      ALL = 2;
    }
    string topic = 1;
    string address = 2;
    string process_uuid = 3;
    string node_uuid = 4;
    .ignition.msgs.Discovery.Publisher.Scope scope = 5;
    oneof pub_type {
      .ignition.msgs.Discovery.Publisher.MessagePublisher msg_pub = 6;
      .ignition.msgs.Discovery.Publisher.ServicePublisher srv_pub = 7;
    }
  }
  enum Type {
    UNINITIALIZED = 0;
    ADVERTISE = 1;
    SUBSCRIBE = 2;
    UNADVERTISE = 3;
    HEARTBEAT = 4;
    BYE = 5;
    NEW_CONNECTION = 6;
    END_CONNECTION = 7;
  }
  .ignition.msgs.Header header = 1;
  uint32 version = 2;
  string process_uuid = 3;
  .ignition.msgs.Discovery.Type type = 4;
  .ignition.msgs.Discovery.Flags flags = 5;
  oneof disc_contents {
    .ignition.msgs.Discovery.Subscriber sub = 6;
    .ignition.msgs.Discovery.Publisher pub = 7;
  }
}
message Distortion {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector2d center = 2;
  double k1 = 3;
  double k2 = 4;
  double k3 = 5;
  double p1 = 6;
  double p2 = 7;
}
message Double {
  .ignition.msgs.Header header = 1;
  double data = 2;
}
message Double_V {
  repeated double data = 1;
}
message Duration {
  .ignition.msgs.Header header = 1;
  int64 sec = 2;
  int32 nsec = 3;
}
message EllipsoidGeom {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Vector3d radii = 2;
}
message Empty {
  bool unused = 1;
}
message Entity {
  enum Type {
    NONE = 0;
    LIGHT = 1;
    MODEL = 2;
    LINK = 3;
    VISUAL = 4;
    COLLISION = 5;
    SENSOR = 6;
    JOINT = 7;
    ACTOR = 8;
    WORLD = 9;
  }
  .ignition.msgs.Header header = 1;
  uint64 id = 2;
  string name = 3;
  .ignition.msgs.Entity.Type type = 4;
}
message EntityFactory {
  .ignition.msgs.Header header = 1;
  oneof from {
    string sdf = 2;
    string sdf_filename = 3;
    .ignition.msgs.Model model = 4;
    .ignition.msgs.Light light = 5;
    string clone_name = 6;
  }
  .ignition.msgs.Pose pose = 7;
  string name = 8;
  bool allow_renaming = 9;
  string relative_to = 10;
  .ignition.msgs.SphericalCoordinates spherical_coordinates = 11;
}
message EntityFactory_V {
  .ignition.msgs.Header header = 1;
  repeated .ignition.msgs.EntityFactory data = 2;
}
message EntityPlugin_V {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Entity entity = 2;
  repeated .ignition.msgs.Plugin plugins = 3;
}
message EntityWrench {
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Entity entity = 2;
  .ignition.msgs.Wrench wrench = 3;
}
message Float {
  .ignition.msgs.Header header = 1;
  float data = 2;
}
message Float_V {
  .ignition.msgs.Header header = 1;
  repeated float data = 2;
}
message Fluid {
  .ignition.msgs.Header header = 1;
  string name = 2;
  repeated .ignition.msgs.Vector3d position = 3;
}
message FluidPressure {
  .ignition.msgs.Header header = 1;
  double pressure = 2;
  double variance = 3;
}
message Fog {
  enum FogType {
    NONE = 0;
    LINEAR = 1;
    EXPONENTIAL = 2;
    EXPONENTIAL2 = 3;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Fog.FogType type = 2;
  .ignition.msgs.Color color = 3;
  float density = 4;
  float start = 5;
  float end = 6;
}
message Friction {
  message Torsional {
    message ODE {
      double slip = 1;
    }
    double coefficient = 1;
    bool use_patch_radius = 2;
    double patch_radius = 3;
    double surface_radius = 4;
    .ignition.msgs.Friction.Torsional.ODE ode = 5;
  }
  .ignition.msgs.Header header = 1;
  double mu = 2;
  double mu2 = 3;
  .ignition.msgs.Vector3d fdir1 = 4;
  double slip1 = 5;
  double slip2 = 6;
  .ignition.msgs.Friction.Torsional torsional = 7;
}
message FuelMetadata {
  message Contact {
    string name = 1;
    string email = 2;
  }
  message Legal {
    string copyright = 1;
    string license = 2;
  }
  message Model {
    string file = 1;
    .ignition.msgs.VersionedName file_format = 2;
  }
  message World {
    string file = 1;
    .ignition.msgs.VersionedName file_format = 2;
  }
  message Dependency {
    string uri = 1;
  }
  message Compatibility {
    string name = 1;
    oneof version_type {
      .ignition.msgs.Version version = 2;
      .ignition.msgs.VersionRange version_range = 3;
    }
  }
  message Categories {
    string first = 1;
    string second = 2;
  }
  oneof resource_type {
    .ignition.msgs.FuelMetadata.Model model = 1;
    .ignition.msgs.FuelMetadata.World world = 2;
  }
  string name = 3;
  string description = 4;
  int32 version = 5;
  repeated .ignition.msgs.FuelMetadata.Contact authors = 6;
  .ignition.msgs.FuelMetadata.Legal legal = 7;
  repeated string tags = 8;
  map<string, string> annotations = 9;
  repeated .ignition.msgs.FuelMetadata.Dependency dependencies = 10;
  repeated .ignition.msgs.FuelMetadata.Compatibility compatibilities = 11;
  .ignition.msgs.FuelMetadata.Categories categories = 12;
}
message GPS {
  .ignition.msgs.Header header = 1;
  string link_name = 2;
  double latitude_deg = 3;
  double longitude_deg = 4;
  double altitude = 5;
  double velocity_east = 6;
  double velocity_north = 7;
  double velocity_up = 8;
}
message GPSSensor {
  message Sensing {
    .ignition.msgs.SensorNoise horizontal_noise = 1;
    .ignition.msgs.SensorNoise vertical_noise = 2;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.GPSSensor.Sensing position = 2;
  .ignition.msgs.GPSSensor.Sensing velocity = 3;
}
message GUI {
  .ignition.msgs.Header header = 1;
  bool fullscreen = 2;
  .ignition.msgs.GUICamera camera = 3;
  repeated .ignition.msgs.Plugin plugin = 4;
}
message GUICamera {
  .ignition.msgs.Header header = 1;
  string name = 2;
  string view_controller = 3;
  .ignition.msgs.Pose pose = 4;
  .ignition.msgs.TrackVisual track = 5;
  string projection_type = 6;
}
message Geometry {
  enum Type {
    BOX = 0;
    CYLINDER = 1;
    SPHERE = 2;
    PLANE = 3;
    IMAGE = 4;
    HEIGHTMAP = 5;
    MESH = 6;
    TRIANGLE_FAN = 7;
    LINE_STRIP = 8;
    POLYLINE = 9;
    CONE = 10;
    EMPTY = 11;
    ARROW = 12;
    AXIS = 13;
    CAPSULE = 14;
    ELLIPSOID = 15;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Geometry.Type type = 2;
  .ignition.msgs.BoxGeom box = 3;
  .ignition.msgs.CylinderGeom cylinder = 4;
  .ignition.msgs.PlaneGeom plane = 5;
  .ignition.msgs.SphereGeom sphere = 6;
  .ignition.msgs.ImageGeom image = 7;
  .ignition.msgs.HeightmapGeom heightmap = 8;
  .ignition.msgs.MeshGeom mesh = 9;
  .ignition.msgs.ConeGeom cone = 10;
  .ignition.msgs.CapsuleGeom capsule = 13;
  .ignition.msgs.EllipsoidGeom ellipsoid = 14;
  repeated .ignition.msgs.Vector3d points = 11;
  repeated .ignition.msgs.Polyline polyline = 12;
}
message Header {
  message Map {
    string key = 1;
    repeated string value = 2;
  }
  .ignition.msgs.Time stamp = 1;
  repeated .ignition.msgs.Header.Map data = 2;
}
message HeightmapGeom {
  message Texture {
    string diffuse = 1;
    string normal = 2;
    double size = 3;
  }
  message Blend {
    double min_height = 1;
    double fade_dist = 2;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Image image = 2;
  .ignition.msgs.Vector3d size = 3;
  .ignition.msgs.Vector3d origin = 4;
  repeated float heights = 5;
  int32 width = 6;
  int32 height = 7;
  repeated .ignition.msgs.HeightmapGeom.Texture texture = 8;
  repeated .ignition.msgs.HeightmapGeom.Blend blend = 9;
  bool use_terrain_paging = 10;
  string filename = 11;
  uint32 sampling = 12;
}
message Hydra {
  message Paddle {
    .ignition.msgs.Pose pose = 1;
    bool button_bumper = 2;
    bool button_1 = 3;
    bool button_2 = 4;
    bool button_3 = 5;
    bool button_4 = 6;
    bool button_joy = 7;
    bool button_center = 8;
    double joy_x = 9;
    double joy_y = 10;
    double trigger = 11;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.Hydra.Paddle right = 2;
  .ignition.msgs.Hydra.Paddle left = 3;
}
message IMU {
  .ignition.msgs.Header header = 1;
  string entity_name = 2;
  .ignition.msgs.Quaternion orientation = 3;
  .ignition.msgs.Vector3d angular_velocity = 4;
  .ignition.msgs.Vector3d linear_acceleration = 5;
}
message IMUSensor {
  message AngularVelocity {
    .ignition.msgs.SensorNoise x_noise = 1;
    .ignition.msgs.SensorNoise y_noise = 2;
    .ignition.msgs.SensorNoise z_noise = 3;
  }
  message LinearAcceleration {
    .ignition.msgs.SensorNoise x_noise = 1;
    .ignition.msgs.SensorNoise y_noise = 2;
    .ignition.msgs.SensorNoise z_noise = 3;
  }
  message OrientationReferenceFrame {
    string localization = 1;
    .ignition.msgs.Vector3d custom_rpy = 2;
    string custom_rpy_parent_frame = 3;
    .ignition.msgs.Vector3d gravity_dir_x = 4;
    string gravity_dir_x_parent_frame = 5;
  }
  .ignition.msgs.Header header = 1;
  .ignition.msgs.IMUSensor.AngularVelocity angular_velocity = 2;
  .ignition.msgs.IMUSensor.LinearAcceleration linear_acceleration = 3;
  .ignition.msgs.IMUSensor.OrientationReferenceFrame orientation_ref_frame = 4;
}
message Image {
  .ignition.msgs.Header header = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 step = 4;
  bytes data = 5;
  .ignition.msgs.PixelFormatType pixel_format_type = 6;
}
message ImageGeom {
  .ignition.msgs.Header header = 1;
  string uri = 2;
  double scale = 3;
  int32 threshold = 4;
  double height = 5;
  int32 granularity = 6;
}
message Inertial {
  .ignition.msgs.Header header = 1;
  double mass = 2;
  .ignition.msgs.Pose pose = 3;
  double ixx = 4;
  double ixy = 5;
  double ixz = 6;
  double iyy = 7;
  double iyz = 8;
  double izz = 9;
}
message Int32 {
  .ignition.msgs.Header header = 1;
  int32 data = 2;
}
message Int32_V {
  .ignition.msgs.Header header = 1;
  repeated int32 data = 2;
}
message Int64 {
  .ignition.msgs.Header header = 1;
  int64 data = 2;
}
message Int64_V {
  .ignition.msgs.Header header = 1;
  repeated int64 data = 2;
}
message Joint {
  message Gearbox {
    string gearbox_reference_body = 1;
    double gearbox_ratio = 2;
  }
  message Screw {
    double thread_pitch = 1;
  }
  enum Type {
    REVOLUTE = 0;
    REVOLUTE2 = 1;
    PRISMATIC = 2;
    UNIVERSAL = 3;
    BALL = 4;
    SCREW = 5;
    GEARBOX = 6;
    FIXED = 7;
  }
  .ignition.msgs.Header header = 1;
  string name = 2;
  uint32 id = 3;
  .ignition.msgs.Joint.Type type = 4;
  string parent = 5;
  uint32 parent_id = 6;
  string child = 7;
  uint32 child_id = 8;
  .ignition.msgs.Pose pose = 9;
  .ignition.msgs.Axis axis1 = 10;
  .ignition.msgs.Axis axis2 = 11;
  double cfm = 12;
  double bounce = 13;
  double fudge_factor = 14;
  double limit_cfm = 15;
  double limit_erp = 16;
  double suspension_cfm = 17;
  double suspension_erp = 18;
  .ignition.msgs.Joint.Gearbox gearbox = 19;
  .ignition.msgs.Joint.Screw screw = 20;
  repeated .ignition.msgs.Sensor sensor = 21;
}
message JointAnimation {
  message Joint {
    repeated string name = 1;
    repeated double angle = 2;
  }
  .ignition.msgs.Header header = 1;
  string model_name = 2;
  repeated .ignition.msgs.JointAnimation.Joint joint = 3;
  repeated .ignition.msgs.Time time = 4;
}
message JointCmd {
  .ignition.msgs.Header header = 1;
  string name = 2;
  int32 axis = 3;
  .ignition.msgs.PID position = 5;
  .ignition.msgs.PID velocity = 6;
  bool reset = 7;
