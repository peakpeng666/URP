# Same service as docker-compose.yml, built with ROS 2 Humble and Gazebo Fortress.
# `docker compose -f deploy/docker-compose.sim.yml up -d --build`
# Ports 8765 and 9002 are published on the host loopback so the Windows browser can open the views.
name: urp-lab

services:
  lab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.simulation
    image: urp-lab-sim:local
    restart: unless-stopped
    ports:
      - "${URP_PUBLISH_HOST:-127.0.0.1}:${URP_PORT:-4100}:4100"
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:9002:9002"
    environment:
      URP_BIND_HOST: "0.0.0.0"
      URP_PORT: "${URP_PORT:-4100}"
      URP_LAB_RUNTIME: /data/lab
      URP_API_DB: /data/archive/research.sqlite3
      URP_FOXGLOVE_BIND: "0.0.0.0"
      URP_BROWSER_HOST: "127.0.0.1"
      URP_EXTRA_HOSTS: "${URP_EXTRA_HOSTS:-}"
      URP_ADMIN_TOKEN: "${URP_ADMIN_TOKEN:-}"
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      URP_RMW: rmw_cyclonedds_cpp
    volumes:
      - lab-runtime:/data/lab
      - archive-data:/data/archive
    cap_add:
      - NET_ADMIN
    shm_size: "1gb"

volumes:
  lab-runtime:
  archive-data:
