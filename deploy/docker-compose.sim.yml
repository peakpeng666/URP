# Pull the published simulation image. This file has no build context, so a
# collaborator does not need the git checkout.
#   docker compose -f deploy/docker-compose.sim.yml up -d
# Local builds use deploy/docker-compose.sim-build.yml.
name: urp-lab

services:
  lab:
    image: ghcr.io/peakpeng666/urp-sim:${URP_IMAGE_TAG:-deploy}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${URP_PUBLISH_HOST:-127.0.0.1}:${URP_PORT:-4100}:4100"
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:9002:9002"
    environment:
      URP_BIND_HOST: "0.0.0.0"
      # URP_PORT configures the host port above; the container always serves 4100.
      URP_PORT: "4100"
      URP_LAB_RUNTIME: /data/lab
      URP_API_DB: /data/archive/research.sqlite3
      URP_FOXGLOVE_BIND: "0.0.0.0"
      URP_BROWSER_HOST: "127.0.0.1"
      URP_EXTRA_HOSTS: "${URP_EXTRA_HOSTS:-}"
      URP_ADMIN_TOKEN: "${URP_ADMIN_TOKEN:-}"
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      URP_RMW: rmw_cyclonedds_cpp
      URP_SIM_PROFILE: image
    volumes:
      - lab-runtime:/data/lab
      - archive-data:/data/archive
    shm_size: "1gb"

volumes:
  lab-runtime:
  archive-data:
