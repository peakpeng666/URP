# Put RViz and the Gazebo GUI on a real display.
# Linux, or Docker started inside a WSL distro that has WSLg:
#   export DISPLAY=${DISPLAY:-:0}
#   URP_DISPLAY=1 docker compose -f deploy/docker-compose.sim.yml -f deploy/docker-compose.display.yml up -d
# The default install leaves DISPLAY unset and uses Xvfb only so Gazebo sensors can use GL.
# That hidden screen is not the Windows desktop. Foxglove in the browser stays available either way.
services:
  lab:
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
