# Optional NVIDIA GPU for the simulation image. Docker Desktop on Windows needs the
# WSL2 backend and an NVIDIA driver that supports CUDA on WSL. Software rendering stays
# the default (LIBGL_ALWAYS_SOFTWARE=1 in the main compose file).
services:
  lab:
    gpus: all
    environment:
      LIBGL_ALWAYS_SOFTWARE: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
